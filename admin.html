<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教师后台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"><span class="bg-dot dot-a"></span><span class="bg-dot dot-b"></span><span class="bg-dot dot-c"></span></div>
  <header class="topbar">
    <a class="brand-wrap" href="/admin.html"><span class="brand-mark admin-mark">管</span><span class="brand-text">教师后台</span></a>
    <a class="link-btn" href="/">返回学生端</a>
  </header>

  <main class="admin-page">
    <section id="adminLogin" class="card login-card admin-login-card">
      <div class="login-copy"><h2>进入教师后台</h2><p>请输入后台密码。</p></div>
      <div class="field"><label for="adminPassword">密码</label><input id="adminPassword" class="input plain-input" type="password" autocomplete="current-password" placeholder="请输入后台密码" /></div>
      <button id="adminLoginBtn" class="primary full enter-button">登录</button>
      <div id="adminError" class="error hidden"></div>
    </section>

    <section id="dashboard" class="hidden">
      <section class="card task-control-card">
        <div class="task-control-copy">
          <div class="panel-kicker">当前课堂任务</div>
          <strong id="activeTaskTitle">正在读取…</strong>
          <span>学生每次进入都会自动进入这里选中的任务；同一任务会继续上次对话。</span>
        </div>
        <div id="taskControlButtons" class="task-control-buttons"></div>
      </section>

      <div class="card dashboard-toolbar">
        <div>
          <div class="toolbar-title">学生数据</div>
          <div id="rosterSummary" class="toolbar-sub">正在读取名单…</div>
        </div>
        <div class="toolbar">
          <button id="uploadRosterBtn" class="primary compact-btn">上传学生名单</button>
          <button id="downloadTemplateBtn" class="secondary compact-btn">下载名单模板</button>
          <button id="refreshBtn" class="secondary compact-btn">刷新</button>
          <button id="exportCsvBtn" class="secondary compact-btn">导出正式 CSV</button>
          <button id="exportJsonBtn" class="secondary compact-btn">导出正式 JSON</button>
          <button id="logoutBtn" class="secondary compact-btn">退出</button>
        </div>
      </div>

      <div class="admin-layout">
        <section class="card panel">
          <div class="panel-head roster-head">
            <div><strong>学生名单</strong><div class="panel-sub">点击学生即可查看任务1、任务2、任务3的独立对话。</div></div>
            <span id="studentCount" class="count-pill"></span>
          </div>
          <div id="studentList" class="student-list"></div>
        </section>

        <section class="card panel">
          <div class="panel-head conversation-head">
            <div>
              <div class="panel-kicker">学生对话</div>
              <strong id="detailTitle">请选择一名学生</strong>
              <div id="detailSub" class="panel-sub">学生一旦提交，刷新后即可在这里看到。</div>
            </div>
            <span id="messageCountPill" class="count-pill hidden"></span>
          </div>
          <div id="studentTaskTabs" class="student-task-tabs hidden"></div>
          <div id="adminMessages" class="admin-messages"><div class="empty empty-chat"><strong>尚未选择学生</strong><span>点击左侧学生后，可以分别查看三个任务中的完整对话和上传图片。</span></div></div>
        </section>
      </div>
    </section>
  </main>

  <div id="rosterModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rosterModalTitle">
    <div class="modal-backdrop" data-close-roster-modal></div>
    <section class="modal-card roster-modal-card">
      <button id="rosterModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
      <div class="modal-icon">表</div>
      <h2 id="rosterModalTitle">上传学生名单</h2>
      <p class="muted">支持 Excel（.xlsx/.xls）和 CSV。第一行只需要一列：<strong>姓名</strong>。</p>
      <label class="roster-drop" for="rosterFile">
        <span class="roster-drop-title">选择名单文件</span>
        <span id="rosterFileName" class="roster-drop-sub">点击选择 Excel 或 CSV</span>
        <input id="rosterFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
      </label>
      <div id="rosterPreview" class="roster-preview hidden"></div>
      <div class="roster-note">重新上传会替换当前可登录名单，但不会删除学生已经产生的三个任务对话。名单如有重名，需要先给重名学生添加可识别标记。</div>
      <button id="confirmRosterBtn" class="primary full enter-button" type="button" disabled>确认上传并替换名单</button>
      <div id="rosterError" class="error hidden"></div>
    </section>
  </div>

  <script src="/vendor/xlsx.full.min.js"></script>
  <script type="module" src="/admin.js"></script>
</body>
</html>
