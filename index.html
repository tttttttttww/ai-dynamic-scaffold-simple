<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>响应式支架小助手</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <span class="bg-dot dot-a"></span>
    <span class="bg-dot dot-b"></span>
    <span class="bg-dot dot-c"></span>
  </div>

  <header class="topbar student-topbar">
    <a class="brand-wrap" href="/" aria-label="响应式支架小助手首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7.4 7.2h9.2a3.4 3.4 0 0 1 3.4 3.4v3.8a3.4 3.4 0 0 1-3.4 3.4h-4.4l-3.3 2.1.8-2.1H7.4A3.4 3.4 0 0 1 4 14.4v-3.8a3.4 3.4 0 0 1 3.4-3.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 12h.01M12 12h.01M15 12h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 3.2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">响应式支架小助手</span>
    </a>
  </header>

  <main class="landing-wrap">
    <section id="loginView" class="login-stage">
      <div class="welcome-panel">
        <div class="visual-scene" aria-hidden="true">
          <div class="visual-halo"></div>
          <div class="visual-card visual-image-card">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3.5" y="4" width="17" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="9" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="m5.8 17 4.2-4.1 2.6 2.4 2.2-2 3.4 3.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="visual-card visual-chat-card">
            <span></span><span></span><span></span>
          </div>
          <div class="visual-spark spark-one">✦</div>
          <div class="visual-spark spark-two">✦</div>
        </div>
        <div class="welcome-copy">
          <span class="eyebrow">课堂学习</span>
          <h1>上传作品，开始学习</h1>
          <p>上传作品图片，和学习伙伴一起交流、修改、完善。</p>
        </div>
      </div>

      <div class="login-panel">
        <div class="login-copy">
          <h2>进入学习平台</h2>
          <p>请输入你的姓名。</p>
        </div>

        <div class="field">
          <label for="studentName">姓名</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M5.7 19.2c.6-3.1 3-5 6.3-5s5.7 1.9 6.3 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <input id="studentName" class="input" maxlength="20" placeholder="请输入姓名" autocomplete="off" />
          </div>
        </div>

        <button id="enterBtn" class="primary full enter-button">进入学习平台 <span aria-hidden="true">→</span></button>
        <div id="loginError" class="error hidden"></div>

        <p class="login-hint">进入后将自动进入老师当前指定的任务。</p>
        <button id="adminEntryBtn" class="admin-entry-link" type="button">管理员进入</button>
      </div>
    </section>

    <section id="chatView" class="card chat-shell hidden">
      <div class="chat-head">
        <div class="chat-head-main">
          <span class="chat-avatar" aria-hidden="true">学</span>
          <div>
            <div class="chat-title-row"><h2>响应式支架小助手</h2><span id="currentTaskBadge" class="task-badge"></span></div>
            <div id="studentMeta" class="student-meta"></div>
            <div id="taskNotice" class="task-notice hidden"></div>
          </div>
        </div>
        <button id="switchBtn" class="secondary">更换学生</button>
      </div>
      <div id="messages" class="messages"></div>
      <div id="processingOverlay" class="processing-overlay hidden" aria-live="polite" aria-busy="true">
        <div class="processing-card">
          <div class="processing-spinner" aria-hidden="true"></div>
          <div class="processing-title">AI 正在思考，请稍候…</div>
          <div class="processing-subtitle">回复完成前，暂时不能继续发送图片或文字。</div>
        </div>
      </div>
      <div class="composer unified-composer">
        <div id="previewRow" class="preview-row compact-preview hidden">
          <img id="previewImage" alt="待上传图片预览" />
          <div class="preview-copy">
            <span class="preview-label">已选择图片</span>
            <div id="previewName" class="preview-name"></div>
          </div>
          <button id="removeImageBtn" class="preview-remove" type="button">移除</button>
        </div>

        <div class="chat-input-row">
          <label class="attach-image-button" for="imageInput" title="上传图片">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="m5.7 17 4-4 3 2.8 2.2-2 3.4 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>图片</span>
            <input id="imageInput" type="file" accept="image/*" />
          </label>
          <textarea id="messageInput" placeholder="输入内容；也可以只上传图片直接发送"></textarea>
          <button id="sendBtn" class="primary send-button" type="button">发送</button>
        </div>
        <div class="composer-footer">
          <span id="sendStatus" class="status"></span>
          <span class="enter-tip">新任务先发作品图 · 后续可继续发图或文字</span>
        </div>
      </div>
    </section>
  </main>

  <div id="adminModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
    <div class="modal-backdrop" data-close-admin-modal></div>
    <section class="modal-card">
      <button id="adminModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
      <div class="modal-icon">管</div>
      <h2 id="adminModalTitle">管理员进入</h2>
      <p class="muted">请输入管理员密码。</p>
      <div class="field">
        <label for="coverAdminPassword">管理员密码</label>
        <input id="coverAdminPassword" class="input plain-input" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button id="coverAdminLoginBtn" class="primary full enter-button" type="button">进入后台</button>
      <div id="coverAdminError" class="error hidden"></div>
    </section>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
